name: Build and Release ESP32 Firmware

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build with ESP-IDF Docker image
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -w /project \
            espressif/idf:v5.0 \
            /bin/bash -lc "idf.py set-target esp32 && idf.py build"

      - name: Copy firmware to stable filename
        run: cp build/m5paper_core.bin firmware.bin

      - name: Publish latest firmware release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest firmware.bin \
            --target "$GITHUB_SHA" \
            --title "Latest Firmware" \
            --notes "Automated firmware build" \
            --latest
